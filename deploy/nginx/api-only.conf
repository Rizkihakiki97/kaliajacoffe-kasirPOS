# Kaliaja.coffe — Nginx untuk mode API-only (frontend di Vercel)
# Backend + MySQL + uploads di VPS; frontend disajikan Vercel.

server_tokens off;
aio threads;

map $uri $kaliaja_auth_key {
    default                                                          "";
    ~^/api/auth/(login|register|forgot-password|reset-password)$      $binary_remote_addr;
}
limit_req_zone $kaliaja_auth_key zone=kaliaja_auth:10m rate=5r/m;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/json application/javascript application/x-javascript application/xml application/xml+rss image/svg+xml;

server {
    listen 80;
    listen [::]:80;
    server_name kaliaja.coffe www.kaliaja.coffe;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kaliaja.coffe www.kaliaja.coffe;

    ssl_certificate     /etc/letsencrypt/live/kaliaja.coffe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kaliaja.coffe/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers off;

    client_max_body_size 6m;
    client_body_timeout 30s;
    keepalive_timeout 30s;

    include /var/www/kaliaja.coffe/deploy/nginx/security-headers.conf;

    location ~ /\.(?!well-known) {
        deny all;
    }

    location /api/ {
        include /var/www/kaliaja.coffe/deploy/nginx/security-headers.conf;
        limit_req zone=kaliaja_auth burst=2 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location ^~ /uploads/ {
        alias /var/www/kaliaja.coffe/backend/uploads/;
        types {
            image/jpeg jpg jpeg;
            image/png  png;
            image/gif  gif;
            image/webp webp;
        }
        default_type application/octet-stream;
        try_files $uri =404;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;

        location ~ \.(php|phtml|jsp|asp|aspx|sh|py|exe|js|html|htm|svg)$ {
            deny all;
        }
    }

    # Root API tidak menyajikan halaman; Vercel yang menangani frontend.
    location / {
        include /var/www/kaliaja.coffe/deploy/nginx/security-headers.conf;
        return 404;
    }
}
